name: 功能建议
description: 提出新命令、新平台支持或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前可以先看 [ROADMAP.md](../../ROADMAP.md)，避免重复提议。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你的实际使用场景，而不只是想要的命令名
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      placeholder: |
        例如：agys use 不带参数时，以当前默认帐号为目标
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过 / 考虑过的其它方案

  - type: dropdown
    id: platform
    attributes:
      label: 主要涉及哪个平台
      options:
        - 全部 / 与平台无关
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .[test]

      - name: Compile check
        run: python -m compileall -q src/agys

      - name: Installer scripts syntax check
        shell: bash
        run: |
          bash -n install.sh uninstall.sh
          echo "shell syntax OK"

      - name: PowerShell installer syntax check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in @('install.ps1','uninstall.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw "$f : $($errors -join '; ')" }
            Write-Host "$f OK"
          }

      - name: Unit tests
        run: pytest -q

      - name: Integration tests (memory backend, no real credentials)
        shell: bash
        run: bash tests/integration/run_tests.sh

      - name: CLI smoke
        shell: bash
        run: |
          agys version
          agys --json doctor
          agys help commands
          agys completion bash
          agys status
          agys doctor --fix

      - name: Offline installer smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          AGYS_INSTALL_DIR="$RUNNER_TEMP/agys-install" AGYS_SKIP_PATH=1 bash install.sh
          "$RUNNER_TEMP/agys-install/bin/agys" version

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-switch"
version = "0.3.0"
description = "Switch between Google accounts in the Antigravity CLI (agy) without logging out and back in"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "zhaoyewei" }]
keywords = ["antigravity", "agy", "cli", "account", "switcher", "google", "multi-account"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/zhaoyewei/antigravity-switch"
Repository = "https://github.com/zhaoyewei/antigravity-switch"
Issues = "https://github.com/zhaoyewei/antigravity-switch/issues"
Changelog = "https://github.com/zhaoyewei/antigravity-switch/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zhaoyewei/antigravity-switch/blob/main/docs/COMMANDS.md"

[project.scripts]
agys = "agys.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
